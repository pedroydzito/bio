<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1200">
  <title>OG</title>
  <link rel="stylesheet" href="/styles.css">
  <style>
    html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
    .og {
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0;
    }
    .og .avatar { width: 168px; height: 168px; margin-bottom: 28px; }
    .og h1 { font-size: 64px; letter-spacing: -0.04em; }
    .og .rule { width: 96px; height: 10px; margin: 18px auto 16px; }
    .og .lead { font-size: 28px; font-weight: 500; }
    .og .handle { font-size: 22px; margin-top: 8px; }
  </style>
</head>
<body class="dots">
  <div class="og">
    <img class="avatar" src="/assets/avatar.jpg" alt="" width="168" height="168">
    <h1>Pedro Lima</h1>
    <span class="rule" aria-hidden="true"></span>
    <p class="lead">Id. Visual</p>
    <p class="handle">@1pedrolima</p>
  </div>
</body>
</html>
